[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqd-scroll"
version = "0.2.2"
description = "懂球帝只读阅读助手的 Python 后端与命令行脚本。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata"]

[project.scripts]
dqd-scroll = "dqd_scroll.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
